# Franka Emika Panda — 7-DoF arm + 1-DoF gripper.
# Source: mujoco_menagerie / franka_emika_panda (Apache-2.0).
# Pulled in by scripts/host/fetch_assets.sh.
#
# Gripper exposure: only `finger_joint1` is in joint_names. `finger_joint2`
# follows via an MJCF <equality><joint> coupling that SolverMuJoCo honors
# at every step — see docs/CONSTRAINTS.md. Commanding either finger via
# /joint_command would conflict with the equality; we expose just one.

robot:
  source: mjcf
  source_rel: models/panda.xml
  base_position: [0.0, 0.0, 0.0]

sim:
  physics_hz: 400
  substeps: 1
  solver: mujoco         # required for <equality> / <mimic> support
  ground_plane: true

joint_names:
  - joint1
  - joint2
  - joint3
  - joint4
  - joint5
  - joint6
  - joint7
  - finger_joint1        # finger_joint2 is dragged by <equality> in panda.xml

home_pose:
  joint1: 0.0
  joint2: -0.7854
  joint3: 0.0
  joint4: -2.3562
  joint5: 0.0
  joint6: 1.5708
  joint7: 0.7854
  finger_joint1: 0.04    # open

drive:
  mode: position
  stiffness: 8000.0
  damping: 80.0

# Per-joint drive override: the finger has ~15g of mass and a 0–4cm range,
# so arm-scale gains (8000/80) would saturate. Tuned by Phase 1a smoke test.
joints:
  finger_joint1:
    drive:
      stiffness: 2000.0
      damping: 50.0

ros:
  joint_states_topic:   /joint_states
  joint_command_topic:  /joint_command
  publish_tf:           true
  tf_root_frame:        world
  publish_frames:       []

# UR5e — Universal Robots 6-DoF collaborative arm.
# Source: ur_description (BSD-3). Copied in by scripts/host/fetch_assets.sh.

robot:
  source: xacro
  source_rel: models/urdf/ur.urdf.xacro
  # xacro args passed as `mappings=` to xacro.process_file. The upstream
  # ur.urdf.xacro defaults `ur_type` to a nonsense placeholder so the robot
  # type MUST be set here. `name` becomes the <robot name="..."> attribute.
  # `force_abs_paths=true` makes the upstream ur_macro emit `file://...`
  # mesh URIs instead of `package://ur_description/...`. The absolute path
  # initially resolves to the ROS share dir, but xacro_loader rewrites it
  # to point at this pack's models/meshes/ tree so runtime mesh loads do
  # NOT touch /opt/ros. See src/newton_bridge/xacro_loader.py.
  source_args:
    name: ur5e
    ur_type: ur5e
    force_abs_paths: true
  base_position: [0.0, 0.0, 0.0]

sim:
  physics_hz: 400
  substeps: 1
  # SolverXPBD does not drive URDF joints via joint_target_pos in Newton
  # 1.1.0 (reproduced: ke/kd/mode correct, but no torques applied). MuJoCo
  # works with builder-level gain config — see world.py _configure_builder_drive.
  solver: mujoco         # xpbd | mujoco | featherstone
  ground_plane: true

joint_names:
  - shoulder_pan_joint
  - shoulder_lift_joint
  - elbow_joint
  - wrist_1_joint
  - wrist_2_joint
  - wrist_3_joint

home_pose:
  shoulder_pan_joint:  0.0
  shoulder_lift_joint: -1.5708
  elbow_joint:          1.5708
  wrist_1_joint:       -1.5708
  wrist_2_joint:       -1.5708
  wrist_3_joint:        0.0

drive:
  mode: position
  stiffness: 10000.0
  damping: 100.0

ros:
  joint_states_topic:   /joint_states
  joint_command_topic:  /joint_command
  publish_rate_hz:      100

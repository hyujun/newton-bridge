name: newton-bridge

services:
  newton-bridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: newton-bridge:latest
    container_name: newton-bridge
    runtime: nvidia
    # network_mode: host is required for DDS discovery to reach host ROS 2.
    # Trade-off: port mappings are ignored; Jupyter at host:8888 is already
    # accessible because the container inherits the host netns directly.
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    # Match the host UID so bind-mounted output files are not root-owned.
    # scripts/host/build.sh / scripts/host/run.sh export HOST_UID/HOST_GID for
    # you; override manually with
    # `HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose up`.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=/tmp/.Xauthority
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics,video,display
      # -- ROS 2 DDS config -------------------------------------------------
      - ROS_DISTRO=jazzy
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      # FastDDS-only knob: SHM transport breaks across UID boundaries, so force
      # UDPv4 when the user opts into FastDDS. scripts/host/run.sh exports this
      # conditionally; the `-` form forwards only when set on the host.
      - FASTDDS_BUILTIN_TRANSPORTS=${FASTDDS_BUILTIN_TRANSPORTS-}
      # -- newton_bridge config --------------------------------------------
      # ROBOT_PACK stays env-only: it selects which /workspace/robots/<name>
      # bind-mount the simulator loads, which is container plumbing, not a
      # session knob. Default is here so `docker compose up` works without
      # the run.sh wrapper.
      - ROBOT_PACK=${ROBOT_PACK:-/workspace/robots/ur5e}
      # The rest of the simulator settings live in config/config.yaml
      # (precedence: CLI > env > yaml > code default). Env vars are still
      # forwarded for ad-hoc override, but with no compose default — that
      # way an unset env doesn't shadow the yaml value.
      - SYNC_MODE=${SYNC_MODE-}                 # freerun | sync
      - FREERUN_RATE=${FREERUN_RATE-}           # realtime | max
      # -- Viewer selection ------------------------------------------------
      - VIEWER=${VIEWER-}                       # gl | rerun | usd | file | null | none
      - VIEWER_WIDTH=${VIEWER_WIDTH-}
      - VIEWER_HEIGHT=${VIEWER_HEIGHT-}
      - RERUN_WEB_PORT=${RERUN_WEB_PORT-}
      - RERUN_GRPC_PORT=${RERUN_GRPC_PORT-}
      # -- Telemetry --------------------------------------------------------
      - STATUS_LOG_HZ=${STATUS_LOG_HZ-}
      # -- Jupyter ----------------------------------------------------------
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-newton}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-${HOME}/.Xauthority}:/tmp/.Xauthority:ro
      # Bind-mount source for live edits; editable install happens at build.
      - ../src:/workspace/newton-bridge/src:ro
      - ../robots:/workspace/robots:ro
      - ../scripts/container:/workspace/scripts:ro
      # Session settings (sync_mode, viewer, …). config.py looks here first;
      # falls back to code defaults if missing. See config/config.yaml.
      - ../config:/workspace/config:ro
      - ../workspace:/workspace/workspace:rw
      # Optional: a host robot_description folder mounted as an external pack.
      # `EXTERNAL_PACK_HOST` defaults to ../robots so the mount is a harmless
      # no-op when unset; scripts/host/run.sh sets it to the user's path and
      # also flips ROBOT_PACK to /workspace/external_pack. URDF only — xacro
      # is not supported on this path (see docs/ROBOTS.md).
      - ${EXTERNAL_PACK_HOST:-../robots}:/workspace/external_pack:ro
      # pip cache survives rebuilds
      - newton-pip-cache:/home/user/.cache/pip
    working_dir: /workspace

volumes:
  newton-pip-cache:
